<!doctype html>
<html>
<body>
<script>
const ACCENT = "#ff5c35";
const ACCENT_DEEP = "#c81456";

// Rounded-corner triangle path (soft "play" glyph, apex pointing right).
// r = triangle radius (center to apex); corner = corner rounding radius.
function roundedTriangle(ctx, cx, cy, r, corner) {
  const pts = [
    [cx + r, cy],                 // apex (right)
    [cx - r * 0.62, cy + r * 0.98], // bottom-left
    [cx - r * 0.62, cy - r * 0.98], // top-left
  ];
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const p0 = pts[i];
    const p1 = pts[(i + 1) % 3];
    const p2 = pts[(i + 2) % 3];
    const d1x = p0[0] - p1[0], d1y = p0[1] - p1[1];
    const len1 = Math.hypot(d1x, d1y);
    const d2x = p2[0] - p1[0], d2y = p2[1] - p1[1];
    const len2 = Math.hypot(d2x, d2y);
    const c = Math.min(corner, len1 * 0.4, len2 * 0.4);
    const start = [p1[0] + (d1x / len1) * c, p1[1] + (d1y / len1) * c];
    const end = [p1[0] + (d2x / len2) * c, p1[1] + (d2y / len2) * c];
    if (i === 0) ctx.moveTo(start[0], start[1]);
    else ctx.lineTo(start[0], start[1]);
    ctx.quadraticCurveTo(p1[0], p1[1], end[0], end[1]);
  }
  ctx.closePath();
}

function sparkle(ctx, cx, cy, r) {
  // simple 4-point star (diamond with concave sides)
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx, cy, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy + r);
  ctx.quadraticCurveTo(cx, cy, cx - r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy - r);
  ctx.closePath();
}

function drawGlyph(ctx, size, scale, color, withSpark) {
  const cx = size * 0.5;
  const cy = size * 0.5;
  const r = size * scale;
  ctx.fillStyle = color;
  roundedTriangle(ctx, cx - size * 0.02, cy, r, r * 0.22);
  ctx.fill();
  if (withSpark) {
    sparkle(ctx, cx + r * 1.05, cy - r * 1.05, r * 0.34);
    ctx.fill();
  }
}

function drawFullIcon(canvas, size) {
  const ctx = canvas.getContext("2d");
  canvas.width = size;
  canvas.height = size;
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, ACCENT);
  g.addColorStop(1, ACCENT_DEEP);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  drawGlyph(ctx, size, 0.26, "#ffffff", true);
}

function drawForeground(canvas, size) {
  // Transparent bg, glyph only, kept inside the adaptive-icon safe zone
  // (inner ~66%) so launcher masks/parallax never crop it.
  const ctx = canvas.getContext("2d");
  canvas.width = size;
  canvas.height = size;
  ctx.clearRect(0, 0, size, size);
  drawGlyph(ctx, size, 0.19, "#ffffff", true);
}

function drawMaskable(canvas, size) {
  // PWA maskable icon: full-bleed gradient (same as full icon) but glyph
  // scaled to the maskable safe zone (~80% diameter → keep glyph ≤ ~35%).
  const ctx = canvas.getContext("2d");
  canvas.width = size;
  canvas.height = size;
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, ACCENT);
  g.addColorStop(1, ACCENT_DEEP);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  drawGlyph(ctx, size, 0.20, "#ffffff", true);
}

window.render = { drawFullIcon, drawForeground, drawMaskable };
</script>
</body>
</html>
