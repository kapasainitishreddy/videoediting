<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ViralEdit AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0A0A0B;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { text-align: center; padding: 2rem; }
    .logo { font-size: 3rem; }
    h1 { font-size: 1.4rem; margin-top: 0.75rem; font-weight: 700; }
    p { margin-top: 0.5rem; color: #9ca3af; font-size: 0.9rem; line-height: 1.5; }
    .spinner {
      margin: 1.5rem auto 0;
      width: 28px; height: 28px;
      border: 3px solid #27272a;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!--
    Offline fallback shell. At runtime the WebView loads the app from
    server.url in capacitor.config.json (the Next.js server), so this
    page is only shown if that URL is unreachable.
  -->
  <div class="wrap">
    <div class="logo">🎬</div>
    <h1>ViralEdit AI</h1>
    <p>Can't reach the server.<br />Check your connection and reopen the app.</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
