apply plugin: "com.android.application"

android {
    namespace "app.viraledit.twa"
    compileSdk 36

    defaultConfig {
        applicationId "app.viraledit.twa"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
    }

    // A COMMITTED debug keystore (not the machine-random one Android Studio
    // normally generates) so its SHA256 fingerprint is stable across every
    // CI run — that fingerprint is baked into
    // public/.well-known/assetlinks.json, which is what lets Chrome hide
    // the URL bar (Digital Asset Links verification). Debug keys are never
    // used for Play Store releases, so committing this one is normal
    // practice (this is exactly what a real release keystore must NOT do).
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // Google's official Trusted Web Activity launcher — this is the same
    // library `bubblewrap` generates a project around. It builds a
    // Chrome Custom Tab pinned to TWA_URL below, hides the URL bar once
    // Digital Asset Links verify ownership (see /.well-known/assetlinks.json
    // in the web app), and falls back to a normal tabbed browser view until
    // then.
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
