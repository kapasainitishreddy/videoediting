name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes TypeScript typecheck)
        run: npm run build

      # The FFmpeg-WASM-driven suites (/dev/detect, /dev/cinetest,
      # /dev/fulltest) need a running server + headless Chromium and take
      # several minutes even locally — deliberately NOT run on every push to
      # keep CI fast. Run them locally before merging anything that touches
      # src/lib/detect.ts, ffmpeg-client.ts, cinematic.ts, or audio-cinema.ts:
      #   npm run build && npm start & npm run test:e2e
