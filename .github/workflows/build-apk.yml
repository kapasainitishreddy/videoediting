name: Build Android APK

# Builds the SELF-CONTAINED Android app: the entire web app (static export,
# including the FFmpeg + MediaPipe WASM engines) is bundled inside the APK
# via Capacitor — no server, no hosting, works fully offline. The optional
# /api cloud features (AI refinement, Whisper, TTS, stock search, reel
# download) aren't in the bundle and degrade to their built-in
# "unavailable" messages; see android/BUNDLED_APK.md.
#
# The finished, debug-signed app-debug.apk is attached to the run as the
# `viraledit-apk` artifact. This build can't run in the authoring sandbox
# (no Android SDK, dl.google.com blocked) — GitHub's runners have both.
on:
  push:
    branches: [claude/ai-video-editing-app-vrohjm]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "scripts/build-static.mjs"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 refuses to run on anything below Node 22
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static export of the web app
        run: node scripts/build-static.mjs

      - name: Copy web build into the Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: viraledit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
