name: Build Android APK

# Builds the Trusted Web Activity shell in android/ into an installable,
# debug-signed .apk and attaches it to the run as a downloadable artifact.
# This does NOT rebuild the web app — the APK is a thin Chrome-powered
# wrapper that opens the deployed site (see android/TWA_README.md). Deploy
# the site first (deploy-netlify.yml, or your own host) and update
# android/app/src/main/res/values/strings.xml if the URL changes.
on:
  push:
    branches: [claude/ai-video-editing-app-vrohjm]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin the wrapper to a version known compatible with AGP 8.5.2
          # (android/build.gradle) instead of whatever system `gradle` the
          # runner image happens to preinstall — that drifts over time and
          # silently breaks this build (AGP has a max supported Gradle
          # version).
          gradle-version: "8.7"

      - name: Generate Gradle wrapper (pinned to 8.7)
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: viraledit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
