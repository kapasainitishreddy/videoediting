name: Build Android APK

# The self-contained Android APK is an explicit build artifact. Run this from
# the Actions tab when an installable APK is needed; routine source pushes do
# not run the full static export + Capacitor + Gradle toolchain.
on:
  workflow_dispatch: {}

concurrency:
  group: viraledit-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static export of the web app
        run: node scripts/build-static.mjs

      - name: Copy web build into the Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: viraledit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
