name: Deploy to Netlify

# Deploys the web app to the Netlify project the Android TWA shell points
# at (viraledit-ai.netlify.app). Requires two repo secrets, both free to
# get from Netlify in under a minute:
#   NETLIFY_AUTH_TOKEN — netlify.com → User settings → Applications →
#     New access token
#   NETLIFY_SITE_ID    — 7a2b7fa7-c254-480f-8eac-a232f9004d7d (already
#     created; or run `netlify sites:list` for your own)
# Without these secrets this workflow no-ops rather than failing loudly —
# add them in Settings → Secrets and variables → Actions, then re-run.
on:
  push:
    branches: [claude/ai-video-editing-app-vrohjm]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NETLIFY_AUTH_TOKEN secret not set — skipping deploy. See this workflow file's header comment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Deploy to Netlify
        if: steps.check.outputs.skip == 'false'
        # netlify-cli invokes netlify.toml's [build] command itself and
        # runs the official @netlify/plugin-nextjs — that's what converts
        # the API routes into Netlify Functions, so this must be `deploy
        # --build`, not a plain static publish of a pre-built .next folder.
        run: npx -y netlify-cli deploy --build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
